<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#101114"/>
<title>健身日历 7.4</title>
<style>
:root{color-scheme:dark;--bg:#101114;--card:#1c1e22;--border:#32353b;--text:#f5f5f7;--muted:#999ba3;--yellow:#f0cf55;--green:#78c79b;--buttonText:#171717;--surface:#25272c;--picker:#23252a;--pickbg:#282a2e;--pickText:#bfc0c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:850px;margin:auto;padding:24px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px}h1{font-size:26px;margin:0}header p{color:var(--muted);margin:6px 0 0;font-size:13px}button{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}.nav{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;min-width:43px;height:42px;font-size:20px}.month{font-size:20px;font-weight:700}.today{background:var(--yellow);border:0;border-radius:12px;padding:10px 14px;font-weight:700;color:var(--buttonText)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday{text-align:center;color:var(--muted);font-size:13px;padding:9px 0 12px}.day{background:var(--card);border:1px solid var(--border);border-radius:13px;min-height:110px;padding:8px;display:flex;flex-direction:column;gap:7px;min-width:0}.day.empty{background:transparent;border-color:transparent}.day.current{border-color:var(--yellow)}.number{font-weight:700;font-size:15px}.number em{font-size:9px;font-style:normal;color:var(--buttonText);background:var(--yellow);padding:2px 4px;border-radius:4px;margin-left:3px}.pick{width:100%;min-width:0;min-height:36px;border:1px dashed var(--border);border-radius:9px;background:var(--pickbg);color:var(--pickText);font-size:12px;padding:4px 3px;text-align:center;white-space:normal;overflow-wrap:anywhere}.pick.selected{background:var(--pickbg);border:1px solid var(--yellow);color:var(--yellow);font-weight:650}.check{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;margin-top:auto}.check input{appearance:none;width:17px;height:17px;border:1.5px solid var(--muted);border-radius:50%;margin:0;flex-shrink:0}.check input:checked{background:var(--yellow);border-color:var(--yellow)}.check input:checked:after{content:'✓';display:block;text-align:center;color:var(--buttonText);font-size:12px;font-weight:800;line-height:14px}.check.disabled{opacity:.35;pointer-events:none}.legend{color:var(--muted);font-size:13px;line-height:1.65;margin:18px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 13px}.panel{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.panel.show{display:flex}.sheet{background:var(--picker);border:1px solid var(--border);border-radius:20px;width:min(460px,100%);padding:20px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 8px 40px #0009}.sheet h2{font-size:18px;margin:0 0 16px;padding:0 7px}.option{width:100%;padding:16px 14px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);margin-bottom:8px;font-size:16px}.option.active{border-color:var(--yellow);color:var(--yellow)}.customBox{padding:12px 4px 5px;border-top:1px solid var(--border);margin-top:7px}.customInput{display:block;width:100%;margin:8px 0 10px;padding:13px 12px;background:var(--pickbg);color:var(--text);border:1px solid var(--border);border-radius:10px;font:inherit;font-size:16px}.customSave{border-color:var(--yellow);color:var(--yellow);text-align:center}.sheet{max-height:85dvh;overflow-y:auto}.cancel{margin-top:6px;width:100%;padding:13px;color:var(--muted);background:transparent;border:0}.hint{font-size:13px;color:var(--muted)}@media(max-width:600px){.app{padding:20px 9px 60px}.calendar{gap:4px}.day{padding:5px 3px;min-height:99px;border-radius:9px;gap:5px}.number{font-size:13px;padding-left:3px}.number em{display:none}.pick{font-size:10px;min-height:38px;padding:3px 1px;border-radius:7px;line-height:1.25}.check{justify-content:center;font-size:10px;gap:2px}.check input{width:15px;height:15px}.check input:checked:after{line-height:12px;font-size:11px}h1{font-size:24px}}@media(max-width:365px){.calendar{gap:3px}.pick{font-size:9px}.day{padding:4px 2px}}

/* 统计与视图切换 */
.summary{border:1px solid var(--border);background:var(--card);border-radius:15px;padding:15px 17px;margin:0 0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.summaryTitle{font-weight:700;font-size:15px}.summaryValue{font-size:20px;font-weight:800;color:var(--yellow);margin-top:5px}.summaryNote{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
.viewBtns{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:12px;border:1px solid var(--border)}.viewBtn{font-size:13px;border:0;border-radius:9px;padding:7px 12px;background:transparent;color:var(--muted)}.viewBtn.active{background:var(--yellow);color:var(--buttonText);font-weight:750}
.calendar.listMode{display:flex;flex-direction:column;gap:7px}.listMode .weekday,.listMode .empty{display:none}.listMode .day{min-height:66px;padding:9px 12px;flex-direction:row;align-items:center;gap:10px}.listMode .number{width:90px;flex-shrink:0}.listMode .pick{flex:1;min-height:40px;font-size:14px}.listMode .check{margin-top:0;flex-shrink:0;font-size:13px;gap:7px}.listMode .check input{width:19px;height:19px}.listMode .check input:checked:after{line-height:16px;font-size:13px}
@media(max-width:600px){.summary{padding:12px;margin-bottom:14px}.summaryValue{font-size:18px}.viewBtn{font-size:12px;padding:7px 10px}.listMode .day{padding:9px 8px;gap:7px}.listMode .number{width:65px;font-size:13px}.listMode .pick{font-size:13px;min-height:38px}.listMode .check{font-size:12px;gap:4px}.listMode .check input{width:17px;height:17px}.listMode .check input:checked:after{font-size:12px;line-height:14px}}
/* 可自定义配色 */
.headerBtns{display:flex;align-items:center;gap:8px;flex-shrink:0}.themeBtn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-weight:650}
.themeSheet{max-height:85dvh;overflow-y:auto}.themeIntro{color:var(--muted);font-size:13px;line-height:1.5;margin:-4px 7px 15px}.themePresets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 7px 17px}.preset{background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:10px 4px;font-size:13px}.preset.active{border:2px solid var(--yellow)}.swatches{display:flex;gap:3px;justify-content:center;margin-bottom:6px}.swatch{height:12px;width:12px;border-radius:50%;border:1px solid #8885}
.colorRow{display:flex;align-items:center;gap:14px;justify-content:space-between;margin:0 7px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:14px}.colorRow input{width:56px;height:37px;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:9px;cursor:pointer}.themeActions{display:flex;gap:8px;margin:18px 7px 0}.themeActions button{flex:1}.themeNote{margin:12px 7px 0;color:var(--muted);font-size:12px}
@media(max-width:600px){.headerBtns{gap:5px}.themeBtn{padding:10px 9px;font-size:13px}.today{padding:10px 11px}header p{font-size:11px}}

.cloudBar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:12px 15px;margin:0 0 16px}.cloudDetails{display:flex;flex-direction:column;gap:4px;min-width:0}.cloudDetails strong{font-size:15px}.cloudDetails span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.cloudDetails small{color:var(--muted);font-size:11px}.cloudActions{display:flex;flex-wrap:wrap;gap:6px}.cloudActions .secondary{font-size:12px;padding:8px 10px}.cloudActions button[hidden]{display:none}

/* 右上角功能菜单 */
.menuWrap{position:relative}.appMenu[hidden]{display:none!important}.appMenu{position:absolute;top:calc(100% + 9px);right:0;width:min(330px,calc(100vw - 28px));max-height:min(75dvh,580px);overflow:auto;background:var(--picker);border:1px solid var(--border);border-radius:15px;z-index:30;box-shadow:0 16px 40px #0007;padding:10px}.menuCloud{padding:10px 9px 13px;border-bottom:1px solid var(--border);margin-bottom:5px}.menuTitle{font-size:16px;font-weight:750;margin-bottom:8px}.menuStatus{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.menuTime{font-size:11px;color:var(--muted);margin-top:5px}.menuCloud .cloudActions{margin-top:11px;display:flex;flex-wrap:wrap;gap:7px}.menuCloud .cloudActions button{padding:9px 11px;font-size:13px}.menuItem{display:block;width:100%;background:transparent;color:var(--text);border:0;border-radius:9px;text-align:left;padding:14px 10px;font-size:15px}.menuItem:active,.menuItem:hover{background:var(--surface)}

/* 训练项目排序：触控长按手柄，桌面拖动 */
.pickerHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 10px}.pickerHead .secondary{padding:8px 10px;font-size:13px}.pickerHead h2{margin:0}.sortInfo{font-size:12px;color:var(--muted);padding:0 8px 10px}.sortRow{display:flex;align-items:stretch;gap:6px;margin-bottom:8px}.sortRow .option{margin:0;flex:1;min-width:0}.sortHandle{touch-action:none;user-select:none;-webkit-user-select:none;width:54px;flex-shrink:0;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:23px;cursor:grab}.sortHandle:active{cursor:grabbing}.removeTraining{width:44px;flex-shrink:0;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:#ff7777;font-size:21px}.confirmRemove,.cancelRemove{width:auto;padding:0 9px;font-size:12px;white-space:nowrap}.confirmRemove{color:#ff7777}.removeTraining[hidden]{display:none}.restoreBox{border-top:1px solid var(--border);padding:12px 5px;margin-top:10px}.restoreItem{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:14px}.restoreItem button{padding:8px 12px}.sortRow.dragging{opacity:.48}.sortRow.dropTarget .option,.sortRow.dropTarget .sortHandle{border-color:var(--yellow)}
</style>
</head>
<body><main class="app">
<header><div><h1>🏋️ 健身日历</h1></div><div class="headerBtns"><button class="today" id="todayBtn">今天</button><div class="menuWrap"><button class="themeBtn" id="menuBtn" aria-label="打开功能菜单" aria-expanded="false" aria-controls="appMenu">☰</button><div class="appMenu" id="appMenu" hidden><div class="menuCloud"><div class="menuTitle">☁️ 云端同步</div><div class="menuStatus" id="syncStatus" role="status">未登录 · 记录仅保存在本机</div><div class="menuTime" id="syncTime"></div><div class="cloudActions"><button class="secondary" id="loginBtn">Google 登录</button><button class="secondary" id="logoutBtn" hidden>退出</button><button class="secondary" id="syncBtn" hidden>立即同步</button></div></div><button class="menuItem" id="themeBtn">🎨 配色</button><button class="menuItem" id="export">导出备份</button><button class="menuItem" id="import">导入备份</button><input id="file" type="file" accept="application/json,.json" hidden/></div></div></div></header>
<section class="summary" aria-live="polite"><div><div class="summaryTitle">🏅 开始健身已经：</div><div class="summaryValue" id="stats">0.0 月 · 0.0 周 · 0 天</div><div class="summaryNote" id="statsRange">尚无已完成的打卡</div></div><div class="viewBtns" role="group" aria-label="日历显示模式"><button class="viewBtn active" id="monthView" aria-pressed="true">月历</button><button class="viewBtn" id="listView" aria-pressed="false">列表</button></div></section>

<div class="controls"><button class="nav" id="prev" aria-label="上个月">‹</button><div class="month" id="month"></div><button class="nav" id="next" aria-label="下个月">›</button></div>
<div id="calendar" class="calendar"></div>

</main>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="sheet"><div class="pickerHead"><h2 id="dialogTitle">选择训练</h2><button class="secondary" id="sortBtn">⇅</button></div><div id="sortInfo" class="sortInfo" hidden>按住右侧 ☰ 并拖动，即可调整项目顺序。</div><div id="options"></div><button class="cancel" id="cancel">取消</button></div></div>
<div class="panel" id="themePanel" role="dialog" aria-modal="true" aria-labelledby="themeTitle"><div class="sheet themeSheet"><h2 id="themeTitle">🎨 自定义颜色</h2><p class="themeIntro">选择预设主题，或点颜色方块逐项调整。修改立即生效并自动保存。</p><div class="themePresets" id="presets"></div><div id="colorRows"></div><div class="themeActions"><button class="secondary" id="resetTheme">恢复默认</button><button class="secondary" id="closeTheme">完成</button></div><p class="themeNote">登录 Google 后配色也会同步到云端；JSON 备份同时包含配色。</p></div></div>
<script>
'use strict';
const KEY='fitness-calendar-v1';
const THEME_KEY='fitness-calendar-theme-v1';
const VIEW_KEY='fitness-calendar-view-v1';
const notifyChange=(type)=>window.dispatchEvent(new CustomEvent('fitness-change',{detail:{type}}));
const DEFAULT_THEME={bg:'#101114',card:'#1c1e22',border:'#32353b',text:'#f5f5f7',muted:'#999ba3',yellow:'#f0cf55',buttonText:'#171717',surface:'#25272c',picker:'#23252a',pickbg:'#282a2e',pickText:'#bfc0c4'};
const PRESETS={
 '经典深色':DEFAULT_THEME,
 '苹果黑金':{...DEFAULT_THEME,bg:'#000000',card:'#191919',border:'#373737',yellow:'#ffd60a',surface:'#242424',picker:'#1c1c1e',pickbg:'#282828'},
 '奶油浅色':{...DEFAULT_THEME,bg:'#f7f5ee',card:'#ffffff',border:'#dedbd0',text:'#242424',muted:'#73736c',yellow:'#d5a72d',buttonText:'#151515',surface:'#eeece4',picker:'#ffffff',pickbg:'#f7f3e7',pickText:'#4c4c4c'},
 '深海蓝':{...DEFAULT_THEME,bg:'#0b1726',card:'#172b41',border:'#304963',text:'#eff7ff',muted:'#a3b9ce',yellow:'#54b8ff',surface:'#1e3a55',picker:'#152a41',pickbg:'#203c58',pickText:'#d6eaff'}
};
const COLOR_FIELDS=[['bg','页面背景'],['card','日期卡片'],['text','主要文字'],['muted','次要文字'],['yellow','按钮与勾选'],['surface','普通按钮'],['pickbg','训练选择背景'],['pickText','训练选择文字'],['border','边框'],['picker','弹窗背景'],['buttonText','强调按钮文字']];
const isHex=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v);
let theme={...DEFAULT_THEME};
try{const stored=JSON.parse(localStorage.getItem(THEME_KEY)||'null');if(stored&&typeof stored==='object'){for(const k of Object.keys(DEFAULT_THEME))if(isHex(stored[k]))theme[k]=stored[k]}}catch(e){}
function applyTheme(){for(const [k,v] of Object.entries(theme))document.documentElement.style.setProperty('--'+k,v);const light=((h)=>{let n=parseInt(h.slice(1),16);return ((n>>16)*.2126+((n>>8)&255)*.7152+(n&255)*.0722)>155})(theme.bg);document.documentElement.style.colorScheme=light?'light':'dark';document.querySelector('meta[name="theme-color"]').setAttribute('content',theme.bg);}
function saveTheme(){try{localStorage.setItem(THEME_KEY,JSON.stringify(theme))}catch(e){console.warn('无法保存主题',e)}notifyChange('theme')}
function setTheme(t){theme={...DEFAULT_THEME};for(const k of Object.keys(DEFAULT_THEME))if(isHex(t?.[k]))theme[k]=t[k];applyTheme();saveTheme();drawThemeEditor()}
function drawThemeEditor(){const p=document.getElementById('presets');p.replaceChildren();for(const [name,colors] of Object.entries(PRESETS)){const b=document.createElement('button');b.className='preset'+(Object.keys(DEFAULT_THEME).every(k=>theme[k].toLowerCase()===colors[k].toLowerCase())?' active':'');const sw=document.createElement('div');sw.className='swatches';for(const k of ['bg','card','yellow']){const dot=document.createElement('i');dot.className='swatch';dot.style.background=colors[k];sw.append(dot)}b.append(sw,document.createTextNode(name));b.onclick=()=>setTheme(colors);p.append(b)}const rows=document.getElementById('colorRows');rows.replaceChildren();for(const [k,label] of COLOR_FIELDS){const row=document.createElement('label');row.className='colorRow';const name=document.createElement('span');name.textContent=label;const input=document.createElement('input');input.type='color';input.value=theme[k];input.setAttribute('aria-label',label);input.oninput=()=>{theme[k]=input.value;applyTheme();saveTheme();for(const b of p.querySelectorAll('.preset'))b.classList.remove('active')};row.append(name,input);rows.append(row)}}
function closeTheme(){document.getElementById('themePanel').classList.remove('show')}
applyTheme();

const TYPES=['休息','胸 + 三头','背 + 二头','腿 + 肩','单杠引体','双杠臂屈伸','健腹轮'];
const ORDER_KEY='fitness-calendar-training-order-v1';
const HIDDEN_KEY='fitness-calendar-hidden-training-v1';
let hiddenTraining=(()=>{try{const x=JSON.parse(localStorage.getItem(HIDDEN_KEY)||'[]');return Array.isArray(x)?x.filter(t=>typeof t==='string'&&t.length<=60):[]}catch{return []}})();
function saveHidden(){try{localStorage.setItem(HIDDEN_KEY,JSON.stringify(hiddenTraining))}catch(e){console.warn('隐藏设置保存失败',e)}notifyChange('order')}
function cleanOrder(list){if(!Array.isArray(list))return [...TYPES];const out=[];for(const x of list)if(typeof x==='string'&&x.trim()&&x.length<=60&&!out.includes(x))out.push(x);for(const x of TYPES)if(!out.includes(x))out.push(x);return out.slice(0,150)}
let trainingOrder=(()=>{try{return cleanOrder(JSON.parse(localStorage.getItem(ORDER_KEY)))}catch{return [...TYPES]}})();
let sortMode=false;
function saveOrder(){try{localStorage.setItem(ORDER_KEY,JSON.stringify(trainingOrder))}catch(e){console.warn('排序保存失败',e)}notifyChange('order')}
function registerCustom(type){if(hiddenTraining.includes(type)){hiddenTraining=hiddenTraining.filter(t=>t!==type);saveHidden()}if(!trainingOrder.includes(type)){trainingOrder.push(type);saveOrder()}}
function orderedTypes(){return cleanOrder(trainingOrder).filter(t=>!hiddenTraining.includes(t))}
const validType=t=>typeof t==='string'&&t.trim().length>0&&t.length<=60;
let entries={};
try{let raw=JSON.parse(localStorage.getItem(KEY)||'{}');if(raw && typeof raw==='object' && !Array.isArray(raw))entries=raw;}catch(e){console.warn('读取记录失败',e)}
const now=new Date();let year=now.getFullYear(),month=now.getMonth(),editing=null;
let viewMode=localStorage.getItem(VIEW_KEY)==='list'?'list':'month';
const el=id=>document.getElementById(id);
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(entries));}catch(e){alert('无法保存数据。请检查是否在隐私模式或文件预览中打开，建议使用 GitHub Pages 网页。')}notifyChange('entries')}
function updateStats(){
 const completed=Object.keys(entries).filter(id=>/^\d{4}-\d{2}-\d{2}$/.test(id)&&validType(entries[id]?.type)&&entries[id].done).sort();
 const days=completed.length;
 el('stats').textContent=`${(days/30).toFixed(1)} 月 · ${(days/7).toFixed(1)} 周 · ${days} 天`;
 el('statsRange').textContent=days?`首次：${completed[0]}　最新：${completed[days-1]}`:'尚无已完成的打卡';
}
function setView(mode){viewMode=mode;try{localStorage.setItem(VIEW_KEY,mode)}catch(e){}render();notifyChange('view')}
function render(){
 updateStats();
 el('monthView').classList.toggle('active',viewMode==='month');el('listView').classList.toggle('active',viewMode==='list');
 el('monthView').setAttribute('aria-pressed',String(viewMode==='month'));el('listView').setAttribute('aria-pressed',String(viewMode==='list'));
 el('month').textContent=`${year} 年 ${month+1} 月`;const grid=el('calendar');grid.classList.toggle('listMode',viewMode==='list');grid.replaceChildren();
 for(const wd of ['一','二','三','四','五','六','日']){let cell=document.createElement('div');cell.className='weekday';cell.textContent=wd;grid.append(cell)}
 const offset=(new Date(year,month,1).getDay()+6)%7;for(let i=0;i<offset;i++){let cell=document.createElement('div');cell.className='day empty';grid.append(cell)}
 const n=new Date(year,month+1,0).getDate();for(let d=1;d<=n;d++){
  const id=key(year,month,d),item=entries[id],selected=item && validType(item.type),isToday=year===now.getFullYear()&&month===now.getMonth()&&d===now.getDate();
  const box=document.createElement('div');box.className='day'+(isToday?' current':'');
  const num=document.createElement('div');num.className='number';num.textContent=d;if(isToday){let mark=document.createElement('em');mark.textContent='今';num.append(mark)}
  const pick=document.createElement('button');pick.type='button';pick.className='pick'+(selected?' selected':'');pick.textContent=selected?item.type:'＋ 选择';pick.setAttribute('aria-label',`${id} 选择训练`);pick.addEventListener('click',()=>showPicker(id));
  const label=document.createElement('label');label.className='check'+(!selected?' disabled':'');const check=document.createElement('input');check.type='checkbox';check.checked=!!(selected&&item.done);check.disabled=!selected;check.setAttribute('aria-label',`${id} 完成打卡`);check.addEventListener('change',()=>{if(entries[id]){entries[id].done=check.checked;save();updateStats()}});label.append(check,document.createTextNode('完成'));
  box.append(num,pick,label);grid.append(box);
 }
}
function chooseTraining(type){const id=editing;if(!id)return;const old=entries[id];entries[id]={type,done:old?.type===type?!!old.done:false};save();hidePicker();render()}
function renderPicker(){
 const id=editing;if(!id)return;
 el('sortBtn').textContent=sortMode?'✓':'⇅';el('sortBtn').title=sortMode?'完成排序':'调整顺序与删除项目';el('sortBtn').setAttribute('aria-label',sortMode?'完成排序':'调整顺序与删除项目');el('sortInfo').hidden=!sortMode;

 if(sortMode&&hiddenTraining.length){

  const saveCustom=document.createElement('button');saveCustom.className='option customSave';saveCustom.textContent='＋ 保存自定义训练';

function showPicker(id){editing=id;sortMode=false;el('dialogTitle').textContent=`${id.replaceAll('-','/')} · 选择训练`;renderPicker();el('panel').classList.add('show')}
el('sortBtn').onclick=()=>{sortMode=!sortMode;renderPicker()};
function hidePicker(){editing=null;sortMode=false;el('panel').classList.remove('show')}

el('menuBtn').addEventListener('click',e=>{e.stopPropagation();let menu=el('appMenu');menu.hidden=!menu.hidden;el('menuBtn').setAttribute('aria-expanded',String(!menu.hidden))});

el('closeTheme').onclick=closeTheme;

el('themePanel').addEventListener('click',e=>{if(e.target===el('themePanel'))closeTheme()});
el('cancel').onclick=hidePicker;el('panel').addEventListener('click',e=>{if(e.target===el('panel'))hidePicker()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){hidePicker();closeTheme()}});
function changeMonth(delta){let next=new Date(year,month+delta,1);year=next.getFullYear();month=next.getMonth();render()}
el('prev').onclick=()=>changeMonth(-1);el('next').onclick=()=>changeMonth(1);el('todayBtn').onclick=()=>{year=now.getFullYear();month=now.getMonth();render()};
el('export').onclick=()=>{closeMenu();let blob=new Blob([JSON.stringify({version:1,entries,theme,viewMode,trainingOrder,hiddenTraining},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='健身日历备份.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};

render();

<script type="module">

import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import {getFirestore,doc,getDoc,runTransaction,onSnapshot} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={
 apiKey:'AIzaSyBtbD7mHT5UiGVLQJbWG3txOiDBLhJszAA',
 authDomain:'fitness-calendar-b637c.firebaseapp.com',
 projectId:'fitness-calendar-b637c',
 storageBucket:'fitness-calendar-b637c.firebasestorage.app',
 messagingSenderId:'1050030904981',
 appId:'1:1050030904981:web:390c0626b4eaaf49d4ed9c'
};
const $=id=>document.getElementById(id);
const status=$('syncStatus'),time=$('syncTime');
const pendingKey='fitness-calendar-pending-v7';
const uidKey='fitness-calendar-cloud-uid-v7';
let auth,db,user=null,unsub=null,processing=false,ready=false,timer=null;
let pending=readPending();
const isDate=k=>/^\d{4}-\d{2}-\d{2}$/.test(k);
function readPending(){try{const x=JSON.parse(localStorage.getItem(pendingKey)||'null');return x&&typeof x==='object'?{dates:x.dates||{},theme:!!x.theme,view:!!x.view,order:!!x.order}:{dates:{},theme:false,view:false,order:false}}catch{return {dates:{},theme:false,view:false,order:false}}}
function storePending(){localStorage.setItem(pendingKey,JSON.stringify(pending))}
const copy=obj=>JSON.parse(JSON.stringify(obj));
let baseline=copy(entries);
function display(message,stamp=false){status.textContent=message;if(stamp)time.textContent='最近成功同步：'+new Date().toLocaleString('zh-CN')}
function setCloudUI(logged){$('loginBtn').hidden=logged;$('logoutBtn').hidden=!logged;$('syncBtn').hidden=!logged}
function markChanges(kind){
 if(kind==='entries'){
  const keys=new Set([...Object.keys(baseline),...Object.keys(entries)]);
  for(const k of keys){if(!isDate(k))continue;const old=JSON.stringify(baseline[k]),next=JSON.stringify(entries[k]);if(old!==next)pending.dates[k]=entries[k]?copy(entries[k]):null}
  baseline=copy(entries);
 }else if(kind==='theme')pending.theme=true;
 else if(kind==='view')pending.view=true;
 else if(kind==='order')pending.order=true;
 storePending();if(user&&ready)schedule();
}
window.addEventListener('fitness-change',e=>markChanges(e.detail.type));
function schedule(){clearTimeout(timer);timer=setTimeout(()=>sync(),650)}
function cleanEntries(obj){const out={};for(const [k,v] of Object.entries(obj||{})){if(isDate(k)&&v&&typeof v.type==='string'&&v.type.trim().length>0&&v.type.length<=60){out[k]={type:v.type,done:!!v.done}}}return out}
function cleanTheme(obj){const out={};for(const k of Object.keys(DEFAULT_THEME))if(typeof obj?.[k]==='string'&&/^#[a-f\d]{6}$/i.test(obj[k]))out[k]=obj[k];return out}
function applyRemote(remote){
 // Pull only unedited remote dates; leave pending local changes untouched.
 const fromCloud=cleanEntries(remote.entries);const next={...fromCloud};
 for(const [k,v] of Object.entries(pending.dates))if(isDate(k)){if(v===null)delete next[k];else next[k]=v}
 entries=next;baseline=copy(next);localStorage.setItem(KEY,JSON.stringify(next));
 if(!pending.theme&&remote.theme){theme={...DEFAULT_THEME,...cleanTheme(remote.theme)};applyTheme();localStorage.setItem(THEME_KEY,JSON.stringify(theme))}
 if(!pending.order&&Array.isArray(remote.trainingOrder)){trainingOrder=cleanOrder(remote.trainingOrder);localStorage.setItem(ORDER_KEY,JSON.stringify(trainingOrder))}
 if(!pending.order&&Array.isArray(remote.hiddenTraining)){hiddenTraining=remote.hiddenTraining.filter(t=>validType(t));localStorage.setItem(HIDDEN_KEY,JSON.stringify(hiddenTraining))}
 if(!pending.view&&(remote.viewMode==='month'||remote.viewMode==='list')){viewMode=remote.viewMode;localStorage.setItem(VIEW_KEY,viewMode)}
 render();
}
async function sync(){
 if(!user||!ready||processing||!navigator.onLine)return;
 processing=true;display('☁️ 正在同步…');const currentUser=user.uid;
 // Snapshot the pending change set; changes made during upload remain queued.
 const patch=copy(pending);
 try{
  const ref=doc(db,'users',currentUser);
  const firstSync=!localStorage.getItem('fitness-calendar-initial-'+currentUser);
  const hasPatch=Object.keys(patch.dates).length||patch.theme||patch.view||patch.order||firstSync;
  const local=copy(entries);const currentTheme=copy(theme);const currentView=viewMode;const currentOrder=copy(trainingOrder);const currentHidden=copy(hiddenTraining);
  let latest;
  if(hasPatch){
   latest=await runTransaction(db,async tx=>{
    const snap=await tx.get(ref),remote=snap.exists()?snap.data():{};
    const merged={...cleanEntries(remote.entries)};
    // On first-ever sync (empty cloud), import existing local records.
    if(!snap.exists())Object.assign(merged,cleanEntries(local));
    else if(firstSync){for(const [k,v] of Object.entries(cleanEntries(local)))if(!(k in merged))merged[k]=v}
    for(const [k,v] of Object.entries(patch.dates))if(isDate(k)){if(v===null)delete merged[k];else merged[k]=v}
    const result={entries:merged,theme:patch.theme||!snap.exists()?currentTheme:remote.theme||currentTheme,viewMode:patch.view||!snap.exists()?currentView:remote.viewMode||currentView,trainingOrder:patch.order||!snap.exists()?currentOrder:remote.trainingOrder||currentOrder,hiddenTraining:patch.order||!snap.exists()?currentHidden:remote.hiddenTraining||[],updatedAt:Date.now()};
    tx.set(ref,result);return result;
   });
   // Never discard changes created during the asynchronous upload.
   for(const [k,v] of Object.entries(patch.dates))if(JSON.stringify(pending.dates[k])===JSON.stringify(v))delete pending.dates[k];
   if(patch.theme&&JSON.stringify(theme)===JSON.stringify(currentTheme))pending.theme=false;
   if(patch.view&&viewMode===currentView)pending.view=false;
   if(patch.order&&JSON.stringify(trainingOrder)===JSON.stringify(currentOrder)&&JSON.stringify(hiddenTraining)===JSON.stringify(currentHidden))pending.order=false;
   storePending();
  }else{
   const snap=await getDoc(ref);
   if(!snap.exists()){
    latest=await runTransaction(db,async tx=>{const fresh=await tx.get(ref);if(fresh.exists())return fresh.data();const result={entries:cleanEntries(local),theme:currentTheme,viewMode:currentView,trainingOrder:currentOrder,hiddenTraining:currentHidden,updatedAt:Date.now()};tx.set(ref,result);return result});
   }else latest=snap.data();
  }

 }catch(err){console.error('云端同步失败',err);display('🟠 同步未完成：'+(err.code||err.message)+' · 本地记录已保留')}

}
async function initialize(){
 try{
  const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
  await setPersistence(auth,browserLocalPersistence);
  onAuthStateChanged(auth,async nextUser=>{
   if(unsub){unsub();unsub=null}user=nextUser;ready=false;setCloudUI(!!user);
   if(!user){display('未登录 · 记录仅保存在本机');time.textContent='';return}
   display('☁️ 已登录，正在读取云端记录…');
   const pastUser=localStorage.getItem(uidKey);
   if(pastUser&&pastUser!==user.uid){
    // Never automatically upload another account's local data.
    pending={dates:{},theme:false,view:false,order:false};storePending();
    if(!confirm('检测到不同的 Google 账号。是否将本机记录保留并仅在本机查看？取消则先从新账号读取云端记录。')){
     entries={};baseline={};localStorage.setItem(KEY,'{}');render();
    }else{await signOut(auth);alert('请使用原 Google 账号登录，避免混用不同账号的记录。');return}
   }
   localStorage.setItem(uidKey,user.uid);
   // Listen for changes from other devices, but avoid overwriting pending local changes.
   unsub=onSnapshot(doc(db,'users',user.uid),snap=>{
    if(snap.metadata.hasPendingWrites||!ready||processing||!localStorage.getItem('fitness-calendar-initial-'+user.uid))return;
    if(snap.exists()){applyRemote(snap.data());display('🟢 已接收云端更新',true)}
   },error=>display('🟠 云端监听失败：'+error.code));
   ready=true;sync();
  },err=>display('🔴 登录状态错误：'+err.message));
 }catch(err){console.error(err);display('🔴 Firebase 加载失败，请检查网络：'+err.message)}
}
$('loginBtn').onclick=async()=>{

};
