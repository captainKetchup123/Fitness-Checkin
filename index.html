<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#f7f5ee"/>
<title>健身日历</title>
<style>
:root{color-scheme:light;--bg:#f7f5ee;--card:#ffffff;--border:#dedbd0;--text:#242424;--muted:#73736c;--yellow:#feab23;--green:#78c79b;--buttonText:#151515;--surface:#eeece4;--picker:#ffffff;--pickbg:#f7f3e7;--pickText:#4c4c4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:850px;margin:auto;padding:24px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px}h1{font-size:26px;margin:0}header p{color:var(--muted);margin:6px 0 0;font-size:13px}button{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}.nav{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;min-width:43px;height:42px;font-size:20px}.month{font-size:20px;font-weight:700}.today{background:var(--yellow);border:0;border-radius:12px;padding:10px 14px;font-weight:700;color:var(--buttonText)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday{text-align:center;color:var(--muted);font-size:13px;padding:9px 0 12px}.day{background:var(--card);border:1px solid var(--border);border-radius:13px;min-height:110px;padding:8px;display:flex;flex-direction:column;gap:7px;min-width:0}.day.empty{background:transparent;border-color:transparent}.day.current{border-color:var(--yellow)}.number{font-weight:700;font-size:15px}.number em{font-size:9px;font-style:normal;color:var(--buttonText);background:var(--yellow);padding:2px 4px;border-radius:4px;margin-left:3px}.pick{width:100%;min-width:0;min-height:36px;border:1px dashed var(--border);border-radius:9px;background:var(--pickbg);color:var(--pickText);font-size:12px;padding:4px 3px;text-align:center;white-space:normal;overflow-wrap:anywhere}.pick.selected{background:var(--pickbg);border:1px solid var(--yellow);color:var(--yellow);font-weight:650}.pick.restDay{background:var(--pickbg);border:1px solid #d8d4c8;color:var(--pickText);font-weight:650}.check{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;margin-top:auto}.check input{appearance:none;width:17px;height:17px;border:1.5px solid var(--muted);border-radius:50%;margin:0;flex-shrink:0}.check input:checked{background:var(--yellow);border-color:var(--yellow)}.check input:checked:after{content:'✓';display:block;text-align:center;color:var(--buttonText);font-size:12px;font-weight:800;line-height:14px}.check.disabled{opacity:.35;pointer-events:none}.legend{color:var(--muted);font-size:13px;line-height:1.65;margin:18px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 13px}.panel{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.panel.show{display:flex}.sheet{background:var(--picker);border:1px solid var(--border);border-radius:20px;width:min(460px,100%);padding:20px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 8px 40px #0009}.sheet h2{font-size:18px;margin:0 0 16px;padding:0 7px}.option{width:100%;padding:16px 14px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);margin-bottom:8px;font-size:16px}.option.active{border-color:var(--yellow);color:var(--yellow)}.customBox{padding:12px 4px 5px;border-top:1px solid var(--border);margin-top:7px}.customInput{display:block;width:100%;margin:8px 0 10px;padding:13px 12px;background:var(--pickbg);color:var(--text);border:1px solid var(--border);border-radius:10px;font:inherit;font-size:16px}.customSave{border-color:var(--yellow);color:var(--yellow);text-align:center}.sheet{max-height:85dvh;overflow-y:auto}.cancel{padding:13px;color:var(--muted);background:transparent;border:0}.pickerFooter{display:flex;align-items:stretch;gap:8px;margin-top:6px}.pickerFooter .cancel{flex:1;min-width:0}.hint{font-size:13px;color:var(--muted)}@media(max-width:600px){.app{padding:20px 9px 60px}.calendar{gap:4px}.day{padding:5px 3px;min-height:99px;border-radius:9px;gap:5px}.number{font-size:13px;padding-left:3px}.number em{display:inline-block}.pick{font-size:10px;min-height:38px;padding:3px 1px;border-radius:7px;line-height:1.25}.check{justify-content:center;font-size:10px;gap:2px}.check input{width:15px;height:15px}.check input:checked:after{line-height:12px;font-size:11px}h1{font-size:24px}}@media(max-width:365px){.calendar{gap:3px}.pick{font-size:9px}.day{padding:4px 2px}}

/* 统计与视图切换 */
.day:not(.empty){min-height:82px}.calendar.listMode .day{min-height:58px}

.summary{border:1px solid var(--border);background:var(--card);border-radius:15px;padding:15px 17px;margin:0 0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.summaryTitle{font-weight:700;font-size:15px}.summaryValue{font-size:20px;font-weight:800;color:var(--yellow);margin-top:5px}.summaryNote{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
.viewBtns{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:12px;border:1px solid var(--border)}.viewBtn{font-size:13px;border:0;border-radius:9px;padding:7px 12px;background:transparent;color:var(--muted)}.viewBtn.active{background:var(--yellow);color:var(--buttonText);font-weight:750}
.calendar.listMode{display:flex;flex-direction:column;gap:7px}.listMode .weekday,.listMode .empty{display:none}.listMode .day{min-height:66px;padding:9px 12px;flex-direction:row;align-items:center;gap:10px}.listMode .number{width:90px;flex-shrink:0}.listMode .pick{flex:1;min-height:40px;font-size:14px}.listMode .check{margin-top:0;flex-shrink:0;font-size:13px;gap:7px}.listMode .check input{width:19px;height:19px}.listMode .check input:checked:after{line-height:16px;font-size:13px}
@media(max-width:600px){.summary{padding:12px;margin-bottom:14px}.summaryValue{font-size:18px}.viewBtn{font-size:12px;padding:7px 10px}.listMode .day{padding:9px 8px;gap:7px}.listMode .number{width:65px;font-size:13px}.listMode .pick{font-size:13px;min-height:38px}.listMode .check{font-size:12px;gap:4px}.listMode .check input{width:17px;height:17px}.listMode .check input:checked:after{font-size:12px;line-height:14px}}
/* 可自定义配色 */
.headerBtns{display:flex;align-items:center;gap:8px;flex-shrink:0}.themeBtn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-weight:650}
.themeSheet{max-height:85dvh;overflow-y:auto}.themeIntro{color:var(--muted);font-size:13px;line-height:1.5;margin:-4px 7px 15px}.themePresets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 7px 17px}.preset{background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:10px 4px;font-size:13px}.preset.active{border:2px solid var(--yellow)}.swatches{display:flex;gap:3px;justify-content:center;margin-bottom:6px}.swatch{height:12px;width:12px;border-radius:50%;border:1px solid #8885}
.colorRow{display:flex;align-items:center;gap:14px;justify-content:space-between;margin:0 7px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:14px}.colorRow input{width:56px;height:37px;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:9px;cursor:pointer}.themeActions{display:flex;gap:8px;margin:18px 7px 0}.themeActions button{flex:1}.themeNote{margin:12px 7px 0;color:var(--muted);font-size:12px}
@media(max-width:600px){.headerBtns{gap:5px}.themeBtn{padding:10px 9px;font-size:13px}.today{padding:10px 11px}header p{font-size:11px}}

.cloudBar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:12px 15px;margin:0 0 16px}.cloudDetails{display:flex;flex-direction:column;gap:4px;min-width:0}.cloudDetails strong{font-size:15px}.cloudDetails span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.cloudDetails small{color:var(--muted);font-size:11px}.cloudActions{display:flex;flex-wrap:wrap;gap:6px}.cloudActions .secondary{font-size:12px;padding:8px 10px}.cloudActions button[hidden]{display:none}

/* 右上角功能菜单 */
.menuWrap{position:relative}.appMenu[hidden]{display:none!important}.appMenu{position:absolute;top:calc(100% + 9px);right:0;width:min(330px,calc(100vw - 28px));max-height:min(75dvh,580px);overflow:auto;background:var(--picker);border:1px solid var(--border);border-radius:15px;z-index:30;box-shadow:0 16px 40px #0007;padding:10px}.menuCloud{padding:10px 9px 13px;border-bottom:1px solid var(--border);margin-bottom:5px}.menuTitle{font-size:16px;font-weight:750;margin-bottom:8px}.menuStatus{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.menuTime{font-size:11px;color:var(--muted);margin-top:5px}.menuCloud .cloudActions{margin-top:11px;display:flex;flex-wrap:wrap;gap:7px}.menuCloud .cloudActions button{padding:9px 11px;font-size:13px}.menuItem{display:block;width:100%;background:transparent;color:var(--text);border:0;border-radius:9px;text-align:left;padding:14px 10px;font-size:15px}.menuItem:active,.menuItem:hover{background:var(--surface)}

/* 训练项目排序：触控长按手柄，桌面拖动 */
.pickerHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 10px}.pickerHead .secondary{padding:8px 10px;font-size:13px}.pickerHead h2{margin:0}.sortInfo{font-size:12px;color:var(--muted);padding:0 8px 10px}.sortRow{display:flex;align-items:stretch;gap:6px;margin-bottom:8px}.sortRow .option{margin:0;flex:1;min-width:0}.sortHandle{touch-action:none;user-select:none;-webkit-user-select:none;width:54px;flex-shrink:0;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:23px;cursor:grab}.sortHandle:active{cursor:grabbing}.removeTraining{width:44px;flex-shrink:0;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:#ff7777;font-size:21px}.confirmRemove,.cancelRemove{width:auto;padding:0 9px;font-size:12px;white-space:nowrap}.confirmRemove{color:#ff7777}.removeTraining[hidden]{display:none}.sortRow.dragging{opacity:.48}.sortRow.dropTarget .option,.sortRow.dropTarget .sortHandle{border-color:var(--yellow)}

/* 节日与日期在同一行；中文节日红色、意大利语节日蓝色 */
.dateHeading{display:flex;align-items:center;gap:4px;min-width:0;width:100%}
.dateHeading>.number{flex-shrink:0}
.holidayLabels{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px;min-width:0;flex:1;padding-top:0}
.holidayLabel{font-size:10px;line-height:1.25;font-weight:600;overflow-wrap:anywhere;min-width:0}
.holidayLabel.cn{color:#d73737}
.holidayLabel.it{color:#2375ce}
.listMode .dateHeading{width:170px;flex-shrink:0}
.listMode .dateHeading>.number{width:auto}
.listMode .holidayLabels{padding-top:1px}
.listMode .holidayLabel{font-size:11px}
/* 列表模式：日期数字与节日文字中线对齐 */
.listMode .dateHeading{align-items:center}
.listMode .dateHeading>.number{line-height:1.25}
.listMode .holidayLabels{align-items:center;padding-top:0}
.listMode .holidayLabel{line-height:1.25}
@media(max-width:600px){.dateHeading{gap:2px}.holidayLabels{gap:1px 2px;padding-top:0;align-items:center}.holidayLabel{font-size:9px;line-height:1.2}.listMode .dateHeading{width:135px;align-items:center}.listMode .holidayLabels{padding-top:0;align-items:center}.listMode .holidayLabel{font-size:10px}}
@media(max-width:365px){.holidayLabel{font-size:8px}.listMode .dateHeading{width:115px}}
/* v80: 节日完整名称单行显示；月历窄格自适应横向缩放，不覆盖相邻日期 */
.calendar:not(.listMode) .holidayLabels{flex-wrap:nowrap;gap:2px;overflow:hidden;white-space:nowrap}
.calendar:not(.listMode) .holidayLabel{display:block;flex:0 0 auto;overflow:hidden;white-space:nowrap;overflow-wrap:normal;line-height:1.2}
.calendar:not(.listMode) .holidayLabelText{display:inline-block;white-space:nowrap;transform-origin:left center;vertical-align:middle}
.calendar.listMode .holidayLabel{overflow-wrap:anywhere}
/* v82: 意大利节日在月历中独占日期与训练按钮之间的一行，中文节日仍跟随日期 */
.calendar:not(.listMode) .holidayItRow{width:100%;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;flex:0 0 15px;height:15px;min-height:15px;line-height:1.2}
.calendar:not(.listMode) .holidayItRow .holidayLabel{display:inline-block;flex:0 0 auto;line-height:1.2;text-align:center}
.calendar:not(.listMode) .holidayItRow .holidayLabelText{transform-origin:left center}

/* 底部导航与体重记录 */
[hidden]{display:none!important}
.app{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.bottomNav{position:fixed;z-index:18;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border)}
.bottomNavInner{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(850px,100%)}
.tabBtn{border:0;border-radius:13px;background:transparent;color:var(--muted);padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:650}
.tabBtn .tabIcon{width:24px;height:24px;display:block;color:currentColor}.tabBtn .tabIcon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.tabBtn.active{background:var(--surface);color:var(--yellow)}
/* v90 手机端底部导航：减少高度，释放日历可视区域 */
@media(max-width:600px){
 .bottomNav{padding:5px 12px calc(5px + env(safe-area-inset-bottom));}
 .bottomNavInner{gap:6px;}
 .tabBtn{padding:6px 10px;gap:2px;border-radius:12px;font-size:12px;line-height:1.25;}
 .tabBtn .tabIcon{width:21px;height:21px;}
}

.weightPage{display:flex;flex-direction:column;gap:16px}
.weightCard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.weightCard h2{font-size:19px;margin:0 0 8px}.weightSub{color:var(--muted);font-size:13px;margin:0 0 18px}
.weightInputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.weightField{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--muted);min-width:0}
.weightField input{width:100%;min-width:0;min-height:46px;background:var(--pickbg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit;font-size:16px;color-scheme:inherit}
.weightSave{width:100%;margin-top:14px;min-height:46px;border:0;border-radius:11px;background:var(--yellow);color:var(--buttonText);font-weight:750}
.weightError{margin-top:10px;color:#c63e35;font-size:13px;min-height:0}.weightError:empty{display:none}.weightError.success{color:#398663}
.weightEmpty{font-size:14px;color:var(--muted);padding:22px 0;text-align:center}
.weightRow{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:13px 0}
.weightRow:last-child{border-bottom:0;padding-bottom:0}.weightDate{font-size:13px;color:var(--muted)}.weightValue{font-size:19px;font-weight:700;margin-top:3px}
.weightRowActions{display:flex;gap:7px}.weightRowActions button{border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:8px 12px}
.weightRowActions button.deleteWeight{color:#c44b43}
.weightPagination{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.weightPagination button{border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:9px 13px;font-size:13px}.weightPagination button:disabled{opacity:.35;cursor:default}.weightPagination span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media(max-width:370px){.weightPagination{gap:9px}.weightPagination button{padding:8px 9px}}
.weightSummary{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:14px;color:var(--muted);font-size:13px}.weightSummary strong{display:block;font-size:23px;color:var(--yellow);margin-top:4px}
.weightCardHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.weightCardHead h2{margin:0}.weightCardHead.compact{margin-bottom:0}
.weightToggleBtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:40px;padding:0;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);box-shadow:0 1px 0 #fff9 inset,0 2px 0 #79715d24,0 5px 12px #50483612;transition:transform .2s ease,box-shadow .2s ease}.weightToggleBtn:hover{box-shadow:0 1px 0 #fff9 inset,0 2px 0 #79715d30,0 7px 14px #50483620}.weightToggleBtn:active{transform:translateY(1px);box-shadow:0 1px 0 #fff9 inset,0 1px 0 #79715d30}.weightToggleBtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .42s cubic-bezier(.22,1,.36,1)}.weightToggleBtn[aria-expanded='false'] svg{transform:rotate(180deg)}
/* v73: 用可插值的网格轨道高度来动画，避免 height:auto 瞬间跳变 */
.weightHistoryBody{display:grid;grid-template-rows:minmax(0,1fr);opacity:1;margin-top:10px;transition:grid-template-rows .62s cubic-bezier(.25,.8,.25,1),opacity .46s ease,margin-top .62s cubic-bezier(.25,.8,.25,1);}
.weightHistoryInner{min-height:0;overflow:hidden;}
/* v79: avoid scroll anchoring fighting the accordion and allow the page to follow it */
.weightHistoryCard{scroll-margin-top:16px;overflow-anchor:none}
.weightHistoryCard.collapsed .weightHistoryBody{grid-template-rows:minmax(0,0fr);opacity:0;margin-top:0;pointer-events:none;}
@media(prefers-reduced-motion:reduce){.weightHistoryBody,.weightToggleBtn svg{transition-duration:.01ms!important}}
@media(max-width:460px){.weightInputs{grid-template-columns:1fr}.weightCard{padding:15px}.weightCardHead{align-items:center}.weightToggleBtn{width:40px;height:38px}}
/* 体重日期：自定义主题日历，避免浏览器的地区格式差异 */
.dateDisplay{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;background:var(--pickbg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px}
.dateDisplay svg{width:19px;height:19px;flex-shrink:0;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dateBackdrop{position:fixed;inset:0;z-index:45;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px}
.datePickerCard{width:min(380px,100%);background:var(--picker);border:1px solid var(--border);border-radius:20px;box-shadow:0 18px 60px #0004;padding:18px;color:var(--text)}
.datePickerHeader{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:17px}.datePickerTitle{font-size:17px;font-weight:750;white-space:nowrap}
.datePickerArrows{display:flex;gap:4px}.datePickerArrows button{min-width:32px;height:34px;border:0;background:var(--surface);color:var(--text);border-radius:9px;font-size:19px;transition:background-color .18s ease,transform .18s ease}.datePickerArrows button:active{transform:scale(.92)}
.datePickerGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;min-height:290px;will-change:transform,opacity}.datePickerTitle{will-change:transform,opacity}.dateWeekday{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 8px}
.dateCell{aspect-ratio:1;min-height:36px;border:0;border-radius:11px;background:transparent;color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center}.dateCell:not(:disabled):hover{background:var(--surface)}
.dateCell:disabled{opacity:.3;cursor:default}.dateCell.isToday{box-shadow:inset 0 0 0 1.5px var(--yellow)}.dateCell.isSelected{background:var(--yellow);color:var(--buttonText);font-weight:800;box-shadow:none}
/* 单层分阶段切换，避免旧月份和新月份重叠 */
.dateGridStage{position:relative;overflow:hidden;min-height:290px}
/* 固定星期标题 + 六周网格，所有月份弹窗高度保持一致 */
.dateGridStage{height:338px;min-height:338px}
.dateGridStage .datePickerGrid{height:338px;min-height:338px;grid-template-rows:28px repeat(6,minmax(0,1fr));align-items:stretch}
.dateGridStage .datePickerGrid .dateCell{aspect-ratio:auto;min-height:0;width:100%;height:100%}
.dateGridStage .datePickerGrid .dateWeekday{align-self:center;padding:0}

@keyframes dateSlideOutNext{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-24px)}}
@keyframes dateSlideInNext{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes dateSlideOutPrev{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px)}}
@keyframes dateSlideInPrev{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes dateTodayPulse{0%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
.dateGridStage .datePickerGrid.outNext{animation:dateSlideOutNext .19s ease-in forwards}
.dateGridStage .datePickerGrid.outPrev{animation:dateSlideOutPrev .19s ease-in forwards}
.dateGridStage .datePickerGrid.inNext{animation:dateSlideInNext .25s ease-out both}

<script>
'use strict';
const KEY='fitness-calendar-v1';
const THEME_KEY='fitness-calendar-theme-v1';
const VIEW_KEY='fitness-calendar-view-v1';
const WEIGHT_KEY='fitness-calendar-weights-v1';
const notifyChange=(type)=>window.dispatchEvent(new CustomEvent('fitness-change',{detail:{type}}));
// Mobile Safari: prevent pinch page zoom, keep scrolling, swipe controls and form input usable.
for(const kind of ['gesturestart','gesturechange']){
 document.addEventListener(kind,e=>e.preventDefault(),{passive:false});
}

const CLASSIC_THEME={bg:'#101114',card:'#1c1e22',border:'#32353b',text:'#f5f5f7',muted:'#999ba3',yellow:'#f0cf55',buttonText:'#171717',surface:'#25272c',picker:'#23252a',pickbg:'#282a2e',pickText:'#bfc0c4'};
const DEFAULT_THEME={...CLASSIC_THEME,bg:'#f7f5ee',card:'#ffffff',border:'#dedbd0',text:'#242424',muted:'#73736c',yellow:'#feab23',buttonText:'#151515',surface:'#eeece4',picker:'#ffffff',pickbg:'#f7f3e7',pickText:'#4c4c4c'};
const PRESETS={
 '经典深色':CLASSIC_THEME,
 '苹果黑金':{...CLASSIC_THEME,bg:'#000000',card:'#191919',border:'#373737',yellow:'#ffd60a',surface:'#242424',picker:'#1c1c1e',pickbg:'#282828'},
 '奶油浅色':DEFAULT_THEME,
 '深海蓝':{...CLASSIC_THEME,bg:'#0b1726',card:'#172b41',border:'#304963',text:'#eff7ff',muted:'#a3b9ce',yellow:'#54b8ff',surface:'#1e3a55',picker:'#152a41',pickbg:'#203c58',pickText:'#d6eaff'}
};
const COLOR_FIELDS=[['bg','页面背景'],['card','日期卡片'],['text','主要文字'],['muted','次要文字'],['yellow','按钮与勾选'],['surface','普通按钮'],['pickbg','训练选择背景'],['pickText','训练选择文字'],['border','边框'],['picker','弹窗背景'],['buttonText','强调按钮文字']];
const isHex=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v);
let theme={...DEFAULT_THEME};
try{const stored=JSON.parse(localStorage.getItem(THEME_KEY)||'null');if(stored&&typeof stored==='object'){for(const k of Object.keys(DEFAULT_THEME))if(isHex(stored[k]))theme[k]=stored[k]}}catch(e){}
function applyTheme(){for(const [k,v] of Object.entries(theme))document.documentElement.style.setProperty('--'+k,v);const light=((h)=>{let n=parseInt(h.slice(1),16);return ((n>>16)*.2126+((n>>8)&255)*.7152+(n&255)*.0722)>155})(theme.bg);document.documentElement.style.colorScheme=light?'light':'dark';document.querySelector('meta[name="theme-color"]').setAttribute('content',theme.bg);}
function saveTheme(){try{localStorage.setItem(THEME_KEY,JSON.stringify(theme))}catch(e){console.warn('无法保存主题',e)}notifyChange('theme')}
function setTheme(t){theme={...DEFAULT_THEME};for(const k of Object.keys(DEFAULT_THEME))if(isHex(t?.[k]))theme[k]=t[k];applyTheme();saveTheme();drawThemeEditor()}
function drawThemeEditor(){const p=document.getElementById('presets');p.replaceChildren();for(const [name,colors] of Object.entries(PRESETS)){const b=document.createElement('button');b.className='preset'+(Object.keys(DEFAULT_THEME).every(k=>theme[k].toLowerCase()===colors[k].toLowerCase())?' active':'');const sw=document.createElement('div');sw.className='swatches';for(const k of ['bg','card','yellow']){const dot=document.createElement('i');dot.className='swatch';dot.style.background=colors[k];sw.append(dot)}b.append(sw,document.createTextNode(name));b.onclick=()=>setTheme(colors);p.append(b)}const rows=document.getElementById('colorRows');rows.replaceChildren();for(const [k,label] of COLOR_FIELDS){const row=document.createElement('label');row.className='colorRow';const name=document.createElement('span');name.textContent=label;const input=document.createElement('input');input.type='color';input.value=theme[k];input.setAttribute('aria-label',label);input.oninput=()=>{theme[k]=input.value;applyTheme();saveTheme();for(const b of p.querySelectorAll('.preset'))b.classList.remove('active')};row.append(name,input);rows.append(row)}}
function closeTheme(){document.getElementById('themePanel').classList.remove('show')}
applyTheme();

const TYPES=['休息','胸 + 三头','背 + 二头','腿 + 肩','单杠引体','双杠臂屈伸','健腹轮'];
const ORDER_KEY='fitness-calendar-training-order-v1';
const HIDDEN_KEY='fitness-calendar-hidden-training-v1';
let hiddenTraining=(()=>{try{const x=JSON.parse(localStorage.getItem(HIDDEN_KEY)||'[]');return Array.isArray(x)?x.filter(t=>typeof t==='string'&&t.length<=60):[]}catch{return []}})();
function saveHidden(){try{localStorage.setItem(HIDDEN_KEY,JSON.stringify(hiddenTraining))}catch(e){console.warn('隐藏设置保存失败',e)}notifyChange('order')}
function cleanOrder(list){if(!Array.isArray(list))return [...TYPES];const out=[];for(const x of list)if(typeof x==='string'&&x.trim()&&x.length<=60&&!out.includes(x))out.push(x);for(const x of TYPES)if(!out.includes(x))out.push(x);return out.slice(0,150)}
let trainingOrder=(()=>{try{return cleanOrder(JSON.parse(localStorage.getItem(ORDER_KEY)))}catch{return [...TYPES]}})();
let openedTrainingRow=null;
let movingTrainingRow=null;
function saveOrder(){try{localStorage.setItem(ORDER_KEY,JSON.stringify(trainingOrder))}catch(e){console.warn('排序保存失败',e)}notifyChange('order')}
function registerCustom(type){
 if(!trainingOrder.includes(type)){
  // A freshly added project has its own identity, even when an old deleted name is reused.
  trainingIds[type]=newTrainingId();saveTrainingIds();
 }
 if(hiddenTraining.includes(type)){hiddenTraining=hiddenTraining.filter(t=>t!==type);saveHidden()}
 if(!trainingOrder.includes(type)){trainingOrder.push(type);saveOrder()}
}
function orderedTypes(){return cleanOrder(trainingOrder).filter(t=>!hiddenTraining.includes(t))}
const validType=t=>typeof t==='string'&&t.trim().length>0&&t.length<=60;
// Stable identities for a training project. Names (including previous names) resolve
// to the same ID, while a dated record keeps the exact label used when it was saved.
const TRAINING_IDS_KEY='fitness-calendar-training-ids-v1';
const newTrainingId=()=>typeof crypto!=='undefined'&&crypto.randomUUID?'t-'+crypto.randomUUID():'t-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function cleanTrainingIds(raw){
 const result={};if(!raw||typeof raw!=='object'||Array.isArray(raw))return result;
 for(const [name,id] of Object.entries(raw))if(validType(name)&&typeof id==='string'&&id.length>1&&id.length<110)result[name]=id;
 return result;
}
let trainingIds=(()=>{try{return cleanTrainingIds(JSON.parse(localStorage.getItem(TRAINING_IDS_KEY)||'{}'))}catch{return {}}})();
function idForTraining(name){if(!validType(name))return null;return trainingIds[name]||(trainingIds[name]=newTrainingId())}
function saveTrainingIds(notify=false){
 try{localStorage.setItem(TRAINING_IDS_KEY,JSON.stringify(trainingIds))}catch(e){console.warn('项目标识保存失败',e)}
 if(notify)notifyChange('order');
}
// Compatibility for the user's existing rename, made before IDs were introduced.
// Only merge this specific, confirmed old/new pair when the old label is hidden.
if(hiddenTraining.includes('单杠引体')&&trainingOrder.includes('引体向上')&&!hiddenTraining.includes('引体向上')){
 const sameId=trainingIds['单杠引体']||trainingIds['引体向上']||newTrainingId();
 trainingIds['单杠引体']=sameId;trainingIds['引体向上']=sameId;
}
for(const name of trainingOrder)idForTraining(name);
saveTrainingIds();
// 同一日期可保存多个训练项目，兼容旧版 {type,done} 数据。
function entryTypes(entry){
 if(!entry||typeof entry!=='object')return [];
 const raw=Array.isArray(entry.types)?entry.types:(validType(entry.type)?[entry.type]:[]);
 return [...new Set(raw.filter(validType))].slice(0,50);
}
function entryItems(entry){
 if(!entry||typeof entry!=='object')return [];
 const names=Array.isArray(entry.types)?entry.types:(validType(entry.type)?[entry.type]:[]);
 const ids=Array.isArray(entry.typeIds)?entry.typeIds:[];
 const seen=new Set(),items=[];
 for(let i=0;i<names.length;i++){
  const name=names[i];if(!validType(name))continue;
  const id=typeof ids[i]==='string'&&ids[i]?ids[i]:idForTraining(name);
  if(seen.has(id))continue;
  seen.add(id);items.push({id,name});
  if(items.length===50)break;
 }
 return items;
}
function entryHasTraining(entry,name){const id=idForTraining(name);return entryItems(entry).some(item=>item.id===id)}
function entryFromItems(items){
 if(!items.length)return null;
 return {type:items[0].name,types:items.map(item=>item.name),typeIds:items.map(item=>item.id),done:true};
}
function normalEntry(entry){return entryFromItems(entryItems(entry))}

let entries={};
try{let raw=JSON.parse(localStorage.getItem(KEY)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw)){for(const [d,v] of Object.entries(raw)){const item=normalEntry(v);if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&item)entries[d]=item;}}}catch(e){console.warn('读取记录失败',e)}
try{localStorage.setItem(KEY,JSON.stringify(entries));saveTrainingIds()}catch(e){}
let weights={};
function roundWeight(x){return Math.round((Number(x)+Number.EPSILON)*10)/10}
function validWeight(x){const n=Number(x);return x!==null&&x!==''&&Number.isFinite(n)&&n>=1&&n<=500&&Math.round(n*10)===n*10}
function cleanWeights(obj){const out={};if(!obj||typeof obj!=='object'||Array.isArray(obj))return out;for(const [d,v] of Object.entries(obj)){if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d+'T00:00:00'))&&validWeight(v))out[d]=Number(v)}return out}
try{weights=cleanWeights(JSON.parse(localStorage.getItem(WEIGHT_KEY)||'{}'))}catch(e){console.warn('读取体重记录失败',e)}
function saveWeights(){try{localStorage.setItem(WEIGHT_KEY,JSON.stringify(weights))}catch(e){console.error('体重记录保存失败',e);alert('体重记录保存失败，请检查浏览器存储或存储空间');return false}try{notifyChange('weights')}catch(e){console.error('体重已本地保存，但同步队列更新失败',e);const status=document.getElementById('syncStatus');if(status)status.textContent='🟠 体重已保存本地，云同步暂未完成'}return true}
const now=new Date();let year=now.getFullYear(),month=now.getMonth(),editing=null;
let viewMode=localStorage.getItem(VIEW_KEY)==='list'?'list':'month';
const el=id=>document.getElementById(id);
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
let trendRange='1';
let trendSelectedDate=null;
function renderWeightChart(){
 const graph=document.getElementById('trendGraph'),detail=document.getElementById('trendDetail');
 if(!graph)return;
 graph.replaceChildren();
 const today=new Date(),todayUTC=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());
 let cutoff=-Infinity;
 if(trendRange!=='all'){
  const first=new Date(today.getFullYear(),today.getMonth()-Number(trendRange),1);
  const day=Math.min(today.getDate(),new Date(first.getFullYear(),first.getMonth()+1,0).getDate());
  cutoff=Date.UTC(first.getFullYear(),first.getMonth(),day);
 }
 const data=Object.entries(weights).map(([date,value])=>({date,value,ts:Date.parse(date+'T00:00:00Z')}))
  .filter(p=>Number.isFinite(p.ts)&&p.ts>=cutoff&&p.ts<=todayUTC).sort((a,b)=>a.ts-b.ts);
 if(!data.length){
  const empty=document.createElement('div');empty.className='trendEmpty';empty.textContent='所选时间段内暂无体重记录';graph.append(empty);
  detail.textContent='添加体重后会自动显示趋势';return;
 }
 const compactChart=window.matchMedia('(max-width:600px)').matches;
 const W=compactChart?360:760,H=compactChart?258:270,L=compactChart?43:46,R=compactChart?12:15,T=18,B=39,pw=W-L-R,ph=H-T-B;
 const minVal=Math.min(...data.map(p=>p.value)),maxVal=Math.max(...data.map(p=>p.value));
 const pad=Math.max(0.5,(maxVal-minVal)*0.22);
 const ymin=minVal-pad,ymax=maxVal+pad;
 const xmin=data[0].ts,xmax=data[data.length-1].ts;
 const x=ts=>data.length===1?L+pw/2:L+(ts-xmin)/(xmax-xmin)*pw;
 const y=v=>T+(ymax-v)/(ymax-ymin)*ph;
 const ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','体重变化曲线图，点击记录点查看数值');
 const add=(parent,tag,attrs={},label)=>{const node=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,String(v));if(label!==undefined)node.textContent=label;parent.append(node);return node};
 const defs=add(svg,'defs');const gradient=add(defs,'linearGradient',{id:'weightTrendFill',x1:'0',y1:'0',x2:'0',y2:'1'});
 add(gradient,'stop',{offset:'0%','stop-color':'var(--yellow)','stop-opacity':'.22'});add(gradient,'stop',{offset:'100%','stop-color':'var(--yellow)','stop-opacity':'0'});
 for(let i=0;i<=3;i++){
  const v=ymin+(ymax-ymin)*i/3,py=y(v);
  add(svg,'line',{class:'trendGrid',x1:L,y1:py,x2:W-R,y2:py});
  add(svg,'text',{class:'trendText',x:L-8,y:py+4,'text-anchor':'end'},v.toFixed(1));
 }
 const fmt=ts=>{const d=new Date(ts);return `${d.getUTCMonth()+1}/${d.getUTCDate()}`};
 const mid=(xmin+xmax)/2;
 if(data.length===1){add(svg,'text',{class:'trendText',x:xmin===xmax?L+pw/2:x(xmin),y:H-10,'text-anchor':'middle'},fmt(xmin))}
 else for(const [ts,anchor] of [[xmin,'start'],[mid,'middle'],[xmax,'end']])add(svg,'text',{class:'trendText',x:x(ts),y:H-10,'text-anchor':anchor},fmt(ts));
 const points=data.map(p=>({...p,x:x(p.ts),y:y(p.value)}));
 let path=`M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
 if(points.length>1){
  // Monotone cubic interpolation: do not overshoot recorded weights.
  const slopes=[];
  for(let i=0;i<points.length-1;i++)slopes.push((points[i+1].y-points[i].y)/(points[i+1].x-points[i].x));
  const tangent=points.map((p,i)=>{
   if(i===0)return slopes[0];if(i===points.length-1)return slopes[slopes.length-1];
   const a=slopes[i-1],b=slopes[i];return a*b<=0?0:Math.sign(a)*Math.min(Math.abs(a),Math.abs(b),.5*(Math.abs(a)+Math.abs(b)));
  });
  for(let i=0;i<points.length-1;i++){
   const a=points[i],b=points[i+1],dx=(b.x-a.x)/3;
   path+=` C ${(a.x+dx).toFixed(2)} ${(a.y+tangent[i]*dx).toFixed(2)}, ${(b.x-dx).toFixed(2)} ${(b.y-tangent[i+1]*dx).toFixed(2)}, ${b.x.toFixed(2)} ${b.y.toFixed(2)}`;
  }
  const area=path+` L ${points[points.length-1].x.toFixed(2)} ${(H-B).toFixed(2)} L ${points[0].x.toFixed(2)} ${(H-B).toFixed(2)} Z`;
  add(svg,'path',{d:area,fill:'url(#weightTrendFill)'});
  add(svg,'path',{class:'trendLine',d:path});
 }
 const selected=data.some(p=>p.date===trendSelectedDate)?trendSelectedDate:null;
 if(trendSelectedDate&&!selected)trendSelectedDate=null;
 for(const p of points){
  add(svg,'circle',{class:'trendDot',cx:p.x,cy:p.y,r:compactChart?5.8:5});
  if(p.date===selected)add(svg,'circle',{class:'trendSelected',cx:p.x,cy:p.y,r:6.4});
  const hit=add(svg,'circle',{class:'trendHit',cx:p.x,cy:p.y,r:compactChart?19:16,tabindex:0,role:'button','aria-label':`${p.date.replaceAll('-','/')}，${p.value.toFixed(1)} 公斤`});
  const pick=()=>{trendSelectedDate=p.date;renderWeightChart()};
  hit.addEventListener('click',pick);
  hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}});
 }
 const chosen=selected?data.find(p=>p.date===selected):null;
 detail.textContent=chosen?`${chosen.date.replaceAll('-','/')} · ${chosen.value.toFixed(1)} kg`:'';
 graph.append(svg);
}
// 点图表数据点以外的任意位置，立即取消高亮与详情（不影响其他按钮）。
document.addEventListener('click',e=>{
 if(!trendSelectedDate||e.target.closest('.trendHit'))return;
 trendSelectedDate=null;
 renderWeightChart();
});
window.addEventListener('resize',()=>{if(!document.getElementById('weightPage').hidden)renderWeightChart()});
document.getElementById('trendRanges').addEventListener('click',e=>{
 const b=e.target.closest('button[data-range]');if(!b)return;
 trendRange=b.dataset.range;
 for(const btn of document.querySelectorAll('.trendRange')){const active=btn===b;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))}
 trendSelectedDate=null;renderWeightChart();
});
const WEIGHT_PAGE_SIZE=20;
let weightPageIndex=0;
document.getElementById('weightPrevPage').addEventListener('click',()=>{if(weightPageIndex>0){weightPageIndex--;renderWeights()}});
document.getElementById('weightNextPage').addEventListener('click',()=>{weightPageIndex++;renderWeights()});
const WEIGHT_HISTORY_COLLAPSED_KEY='fitness-calendar-weight-history-collapsed-v1';
let weightHistoryCollapsed=false;
try{weightHistoryCollapsed=localStorage.getItem(WEIGHT_HISTORY_COLLAPSED_KEY)==='1'}catch(e){}
const weightHistoryCard=document.getElementById('weightHistoryCard');
const weightHistoryToggle=document.getElementById('weightHistoryToggle');
const weightHistoryBody=document.getElementById('weightHistoryBody');
// v86: single synchronized scroll animation (no stacked smooth-scroll requests).
let weightHistoryFollowFrame=0;
function stopWeightHistoryFollow(){
 if(weightHistoryFollowFrame){cancelAnimationFrame(weightHistoryFollowFrame);weightHistoryFollowFrame=0;}
}
function applyWeightHistoryCollapsed(){
 const expanded=!weightHistoryCollapsed;
 weightHistoryToggle.setAttribute('aria-expanded',String(expanded));
 weightHistoryToggle.setAttribute('aria-label',expanded?'收起体重历史':'展开体重历史');
 weightHistoryCard.classList.toggle('collapsed',!expanded);
}
function followWeightHistory(expanding){
 stopWeightHistoryFollow();
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const initialY=window.scrollY;
 const cardTop=initialY+weightHistoryCard.getBoundingClientRect().top;
 const destination=expanding?Math.max(0,cardTop-16):Math.min(initialY,Math.max(0,cardTop-16));
 if(reduced){
  requestAnimationFrame(()=>window.scrollTo({top:Math.min(destination,Math.max(0,document.documentElement.scrollHeight-window.innerHeight)),behavior:'instant'}));
  return;
 }
 // Accordion runs 620ms. Move the page with it in one rAF-controlled trajectory.
 const duration=620;
 let startTime=null;
 const step=(time)=>{
  if(startTime===null)startTime=time;
  const t=Math.min(1,(time-startTime)/duration);
  const eased=1-Math.pow(1-t,3);
  // The available scroll range grows while the history expands.
  const maxScroll=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
  const desired=initialY+(destination-initialY)*eased;
  window.scrollTo({top:Math.max(0,Math.min(maxScroll,desired)),behavior:'instant'});
  if(t<1)weightHistoryFollowFrame=requestAnimationFrame(step);
  else weightHistoryFollowFrame=0;
 };
 weightHistoryFollowFrame=requestAnimationFrame(step);
}
function setWeightHistoryCollapsed(next){
 const wasCollapsed=weightHistoryCollapsed;
 weightHistoryCollapsed=!!next;
 try{localStorage.setItem(WEIGHT_HISTORY_COLLAPSED_KEY,weightHistoryCollapsed?'1':'0')}catch(e){}
 applyWeightHistoryCollapsed();
 followWeightHistory(wasCollapsed&&!weightHistoryCollapsed);
}
// Stop automatically following if the user starts scrolling manually.
window.addEventListener('touchstart',stopWeightHistoryFollow,{passive:true});
window.addEventListener('wheel',stopWeightHistoryFollow,{passive:true});

let dateTransitionTimers=[];

function navigatePicker(targetYear,targetMonth,direction=1,after){
 resetDateAnimation();const id=dateTransitionId;
 const grid=document.getElementById('datePickerGrid'),title=document.getElementById('datePickerTitle');
 const changed=targetYear!==datePickerYear||targetMonth!==datePickerMonth;
 if(!changed){
  void grid.offsetWidth;grid.classList.add('todayPulse');title.classList.add('switching');
  dateTransitionTimers.push(setTimeout(()=>{if(id!==dateTransitionId)return;resetDateAnimation();after?.()},410));
  return;
 }
 const way=direction<0?'Prev':'Next';
 void grid.offsetWidth;grid.classList.add('out'+way);title.classList.add('switching');
 dateTransitionTimers.push(setTimeout(()=>{
  if(id!==dateTransitionId)return;
  grid.classList.remove('out'+way);
  datePickerYear=targetYear;datePickerMonth=targetMonth;renderDatePicker();
  grid.classList.add('in'+way);
  dateTransitionTimers.push(setTimeout(()=>{
   if(id!==dateTransitionId)return;
   resetDateAnimation();after?.();
  },270));
 },190));
}

(function(){
 const form=document.getElementById('weightForm');
 const input=document.getElementById('weightAmount');
 const status=document.getElementById('weightError');
 let saving=false;
 function showWeightError(message){status.textContent=message;status.classList.remove('success')}
 // Clicking anywhere outside the message and Save button dismisses an old error.
 // Ignore Save itself so a newly displayed validation error stays visible.
 document.addEventListener('click',event=>{
  if(!status.textContent)return;
  if(event.target.closest('.weightSave')||status.contains(event.target))return;
  status.textContent='';
  status.classList.remove('success');
 });
 function submitWeight(event){
  event?.preventDefault();
  if(saving)return;
  const date=document.getElementById('weightDate').value;
  const raw=input.value.trim().replace(',','.');
  const inputNumber=Number(raw);
  const value=roundWeight(inputNumber);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){
    showWeightError('请选择有效日期');return;
  }
  if(!raw||!Number.isFinite(inputNumber)||inputNumber<1||inputNumber>500){
    showWeightError('请输入 1–500 kg 的有效体重');return;
  }
  saving=true;
  try{
   const next={...weights,[date]:value};
   localStorage.setItem(WEIGHT_KEY,JSON.stringify(next));
   weights=next;
   weightPageIndex=0;
   status.textContent='';
   input.value='';
   try{renderWeights()}catch(error){
    console.error('体重历史显示失败',error);
    showWeightError('体重已保存，但显示更新失败，请刷新页面');
   }
   try{notifyChange('weights')}catch(error){console.warn('云同步待重试',error)}
  }catch(error){
   console.error('保存体重失败',error);
   showWeightError('保存失败：'+(error?.message||String(error)));
  }finally{saving=false}
 }
 form.addEventListener('submit',submitWeight);
})();

// 中国与意大利节日：不调用网络，也不写入打卡记录。
// 传统农历节日按中国农历日计算；2026、2027 年使用核对后的公历日期，
// 避免部分平台的 Intl 农历算法在 2027 年春节附近出现一日偏差。
const CHINA_FIXED={
 '01-01':['元旦'], '05-01':['劳动节'], '10-01':['国庆节']
};
const ITALY_FIXED={
 '01-01':['Capodanno'], '01-06':['Epifania'], '04-25':['Festa della Liberazione'],
 '05-01':['Festa del Lavoro'], '06-02':['Festa della Repubblica'],
 '06-24':['San Giovanni Battista (Torino)'], '08-15':['Ferragosto'],
 '10-04':["San Francesco d’Assisi"], '11-01':['Ognissanti'],
 '12-08':['Immacolata Concezione'], '12-25':['Natale'], '12-26':['Santo Stefano']
};
const LUNAR_FESTIVALS={
 '1-1':'春节','1-15':'元宵节','5-5':'端午节','7-7':'七夕节',
 '8-15':'中秋节','9-9':'重阳节','12-8':'腊八节'
};
// 已核实年份的主要农历节日（避免浏览器农历库日期差异）
const VERIFIED_CHINA={
 2026:{'01-26':'腊八节','02-16':'除夕','02-17':'春节','03-03':'元宵节',
       '06-19':'端午节','08-19':'七夕节','09-25':'中秋节','10-18':'重阳节'},
 2027:{'01-15':'腊八节','02-05':'除夕','02-06':'春节','02-20':'元宵节',
       '06-09':'端午节','08-08':'七夕节','09-15':'中秋节','10-08':'重阳节'}
};
let lunarFormatter=null;
try{lunarFormatter=new Intl.DateTimeFormat('en-u-ca-chinese',{
 month:'numeric',day:'numeric',timeZone:'Asia/Shanghai'
});}catch(e){console.warn('当前浏览器不支持中国农历格式',e)}
function chineseLunarFestival(y,m,d){
 const md=`${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 if(VERIFIED_CHINA[y])return VERIFIED_CHINA[y][md]||null;
 if(!lunarFormatter)return null;
 try{
  // 使用中国本地日期的正午，避免时区切换引起日期偏移。
  const parts=lunarFormatter.formatToParts(new Date(Date.UTC(y,m-1,d,4)));
  const rawMonth=parts.find(x=>x.type==='month')?.value||'';
  if(!/^\d+$/.test(rawMonth))return null; // 跳过闰月
  const lunarDay=Number(parts.find(x=>x.type==='day')?.value);
  const lunarMonth=Number(rawMonth);
  const name=LUNAR_FESTIVALS[`${lunarMonth}-${lunarDay}`];
  if(name)return name;
  // 除夕：农历新年前一天
  if(lunarMonth===12&&lunarDay>=29){
   const tomorrow=new Date(Date.UTC(y,m-1,d+1,4));
   const p=lunarFormatter.formatToParts(tomorrow);
   if(p.find(x=>x.type==='month')?.value==='1'&&p.find(x=>x.type==='day')?.value==='1')return '除夕';
  }
 }catch(e){}
 return null;
}
function gregorianEaster(year){
 const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
 const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
 const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
 const l=(32+2*e+2*i-h-k+7)%7,mm=Math.floor((a+11*h+22*l)/451);
 const n=Math.floor((h+l-7*mm+114)/31),day=(h+l-7*mm+114)%31+1;
 return new Date(Date.UTC(year,n-1,day));
}
function holidaysFor(y,m,d){
 const md=`${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 const out=[];
 for(const label of CHINA_FIXED[md]||[])out.push({country:'cn',label});
 const lunar=chineseLunarFestival(y,m,d);
 if(lunar)out.push({country:'cn',label:lunar});
 // 清明节由节气决定，附近年份采用精确日期表；其余年份不猜测。
 const qingming={2025:'04-04',2026:'04-05',2027:'04-05',2028:'04-04',2029:'04-04',2030:'04-05',2031:'04-05',2032:'04-04',2033:'04-04',2034:'04-05',2035:'04-05'};
 if(qingming[y]===md)out.push({country:'cn',label:'清明节'});
 for(const label of ITALY_FIXED[md]||[])if(y>=2026||md!=='10-04')out.push({country:'it',label});
 const easter=gregorianEaster(y);
 const current=Date.UTC(y,m-1,d);
 if(current===easter.getTime())out.push({country:'it',label:'Pasqua'});
 if(current===easter.getTime()+86400000)out.push({country:'it',label:'Pasquetta'});
 return out;
}

function fitMonthHolidayLabels(){
 const grid=document.getElementById('calendar');
 if(!grid||grid.classList.contains('listMode'))return;
 for(const group of grid.querySelectorAll('.holidayLabels')){
  const labels=[...group.querySelectorAll('.holidayLabel')];
  const available=group.clientWidth;
  if(!labels.length||available<=0)continue;
  const gap=labels.length>1?2*(labels.length-1):0;
  const usable=Math.max(1,available-gap);
  const sizes=labels.map(label=>{
   const inner=label.querySelector('.holidayLabelText');
   inner.style.transform='none';
   label.style.width='auto';
   return Math.max(1,inner.scrollWidth);
  });
  const total=sizes.reduce((a,b)=>a+b,0);
  const factor=Math.min(1,usable/total);
  labels.forEach((label,i)=>{
   const inner=label.querySelector('.holidayLabelText');
   label.style.width=(sizes[i]*factor)+'px';
   inner.style.transform=factor<.999?`scaleX(${factor})`:'none';
  });
 }
}

function markChanges(kind){
 if(kind==='entries'){
  const keys=new Set([...Object.keys(baseline),...Object.keys(entries)]);
  for(const k of keys){if(!isDate(k))continue;const old=JSON.stringify(baseline[k]),next=JSON.stringify(entries[k]);if(old!==next)pending.dates[k]=entries[k]?copy(entries[k]):null}

  if(!pending.weights||typeof pending.weights!=='object')pending.weights={};
  const keys=new Set([...Object.keys(weightBaseline),...Object.keys(weights)]);
  for(const k of keys){if(!isDate(k))continue;if(weightBaseline[k]!==weights[k])pending.weights[k]=weights[k]??null}

function cleanEntries(obj){const out={};for(const [k,v] of Object.entries(obj||{})){if(!isDate(k))continue;const normalized=normalEntry(v);if(normalized)out[k]=normalized;}return out}

function applyRemote(remote){
 // Pull only unedited remote dates; leave pending local changes untouched.
 const fromCloud=cleanEntries(remote.entries);const next={...fromCloud};
 for(const [k,v] of Object.entries(pending.dates))if(isDate(k)){if(v===null)delete next[k];else next[k]=v}

  // Keep locally known aliases as well as the cloud mapping.

async function sync(){
 if(!user||!ready||processing||!navigator.onLine)return;
 processing=true;display('☁️ 正在同步…');const currentUser=user.uid;
 // Snapshot the pending change set; changes made during upload remain queued.
 const patch=copy(pending);
 try{
  const ref=doc(db,'users',currentUser);
  const firstSync=!localStorage.getItem('fitness-calendar-initial-'+currentUser);

  const local=copy(entries);const localWeights=copy(weights);const currentTheme=copy(theme);const currentView=viewMode;const currentOrder=copy(trainingOrder);const currentHidden=copy(hiddenTraining);const currentTrainingIds=copy(trainingIds);

    for(const [k,v] of Object.entries(patch.dates))if(isDate(k)){if(v===null)delete merged[k];else merged[k]=v}
    const mergedWeights={...cleanWeights(remote.weights)};
     if(!snap.exists())Object.assign(mergedWeights,cleanWeights(localWeights));
     else if(firstSync){for(const [k,v] of Object.entries(cleanWeights(localWeights)))if(!(k in mergedWeights))mergedWeights[k]=v}
     for(const [k,v] of Object.entries(patch.weights))if(isDate(k)){if(v===null)delete mergedWeights[k];else if(validWeight(v))mergedWeights[k]=Number(v)}
     const result={entries:merged,weights:mergedWeights,theme:patch.theme||!snap.exists()?currentTheme:remote.theme||currentTheme,viewMode:patch.view||!snap.exists()?currentView:remote.viewMode||currentView,trainingOrder:patch.order||!snap.exists()?currentOrder:remote.trainingOrder||currentOrder,hiddenTraining:patch.order||!snap.exists()?currentHidden:remote.hiddenTraining||[],trainingIds:patch.order||!snap.exists()?currentTrainingIds:remote.trainingIds||currentTrainingIds,updatedAt:Date.now()};

   display('☁️ 已登录，正在读取云端记录…');

   if(pastUser&&pastUser!==user.uid){
    // Never automatically upload another account's local data.
    pending={dates:{},weights:{},theme:false,view:false,order:false};storePending();

   }

   // Listen for changes from other devices, but avoid overwriting pending local changes.
   unsub=onSnapshot(doc(db,'users',user.uid),snap=>{

   },error=>display('🟠 云端监听失败：'+error.code));
   ready=true;sync();
  },err=>display('🔴 登录状态错误：'+err.message));
 }catch(err){console.error(err);display('🔴 Firebase 加载失败，请检查网络：'+err.message)}
